<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat with PDF</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px}
  input,button{font-size:16px;padding:8px;margin:6px 0;width:100%;box-sizing:border-box}
  button{cursor:pointer}
  pre{white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:6px}
</style>
</head>
<body>
  <h2>Chat with PDF (RAG)</h2>
  <input type="file" id="pdf" accept="application/pdf" />
  <input type="text" id="question" placeholder="Ask a question about the PDF..." />
  <button id="send">Ask</button>
  <pre id="answer">Answer will appear here.</pre>
<script>
  document.getElementById("send").onclick = async () => {
    const file = document.getElementById("pdf").files[0];
    const question = document.getElementById("question").value;
    const out = document.getElementById("answer");
    if (!file || !question) { out.textContent = "Choose a PDF and type a question."; return; }
    const form = new FormData();
    form.append("pdf", file);
    form.append("question", question);
    out.textContent = "Thinking...";
    try {
      const res = await fetch("/upload", { method: "POST", body: form });
      out.textContent = await res.text();
    } catch (e) { out.textContent = "Request failed: " + e.message; }
  };
</script>
</body>
</html>
